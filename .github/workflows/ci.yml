name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Generate synthetic demo data
        run: |
          python scripts/build_synthetic_dataset.py
          python -m pharmaeval autograde
          python scripts/generate_synthetic_annotations.py
      - name: Validate data, registry and rubric
        run: python -m pharmaeval validate
      - name: Run tests
        run: pytest -q
      - name: Run full pipeline
        run: python -m pharmaeval run-all
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python-version }}
          path: reports/
